# ========================================================
# 		QPROTO CONFIGURATION
# ========================================================
#
# Place next to the .so (cstrike/addons/qproto/), in cstrike/, or at the HLDS root
# (dproto.cfg style). First found wins; recommended: keep it with the plugin.
#

# ========================================================
# 		EMULATOR SWITCHES
# ========================================================
# Per-emulator on/off, like cid_* in dproto.cfg. All 1 (on) by default.

# RevEmu >= 9.74 (152-byte ticket, signature "rev") - the mainstream/active format,
# confirmed working live with NextClient this session.
EnableRevEmu = 1

# RevEmu2013 (194-byte ticket, AES+SHA256)
EnableRevEmu2013 = 1

# SteamClient 2009 / SC2009 (178-byte ticket, AES+SHA256, same family as RevEmu2013)
EnableSC2009 = 1

# Legacy 10-byte ticket (magic 0xFFFF + XOR-encoded SteamID, no crypto). This is the
# format your rev.ini's RevEmu_2012/AllowOldRev flags most likely correspond to.
EnableOldRevEmu = 1

# sXe Injected anti-cheat hardware id (engine-protected "*HID" userinfo key - ordinary
# client code can't set keys starting with '*' via a plain setinfo, same trust level
# as the "*hltv" key HLTV detection relies on below).
EnableSXEI = 1

# Not implemented, deliberately: AVSMP, SteamEmu (hCupa), SmartSteamEmu (SSE3).
# AVSMP/SteamEmu are long-abandoned, effectively dead formats with no real ticket
# security to speak of (AVSMP transmits the steamid completely unencrypted); SSE3's
# real dproto validation is a separate, more involved research task (different crypto
# pipeline, possibly a different hook point) - none of the three are worth the risk
# surface for the practically-zero real users left on them.

# ========================================================
# 		OUTPUT ID TYPE PER EMULATOR (cid_*)
# ========================================================
# Same numbering as dproto.cfg's cid_RevEmu etc.:
#  1: Real STEAM_xx:xx:xx        7: HLTV
#  2: Real VALVE_xx:xx:xx        8/9:  STEAM_ID_LAN / STEAM_ID_PENDING
#  3: STEAM_ by IP               10/11: VALVE_ID_LAN / VALVE_ID_PENDING
#  4: VALVE_ by IP               12: STEAM_666:88:666
#  5: Deprecated - client will be rejected
#
# We write into the engine's own client_t::network_userid and let its unmodified
# SV_GetIDString format the final string, which only understands idtype STEAM(1)/
# VALVE(2)/LOCAL(3=HLTV) - so anything other than 1, 2, 5 or 7 above still gets
# rendered as STEAM or VALVE (whichever family it belongs to); 5 rejects the client
# outright, matching dproto.cfg exactly.

cid_RevEmu = 1
cid_RevEmu2013 = 1
cid_SC2009 = 1
cid_OldRevEmu = 1
cid_SXEI = 1

# ========================================================
# 		OTHER CONNECTION KINDS (ported from classic's client_auth.cpp)
# ========================================================
# These aren't ticket formats - they're recognized from connection context, exactly
# like classic's CSettiAuthorizer/CNoSteam47/48Authorizer. (classic also has a
# CHLTVAuthorizer/cid_HLTV - not applicable here: verified via Ghidra decompilation
# that HLTV proxy connections on this engine use a separate code path that never calls
# Steam_NotifyClientConnect, the one function qproto hooks, so qproto can never see
# them at all - there is no cid_HLTV to configure.)

# cid_Setti: Setti monitoring/promotion bot (recognized by its fixed 0x300-byte
# ticket and magic constants, same as classic). Default 3 (STEAM_by_IP) - it's not
# an attacker, don't reject it (matches the cid_Setti=3 convention already used in
# dproto.cfg on this server).
cid_Setti = 3

# cid_NoSteam47 / cid_NoSteam48: client sent no ticket at all (native Steam check
# failed and nothing above matched), split by negotiated protocol version - same
# two separate keys dproto.cfg itself uses. Default 5 (Deprecated/reject) - unlike a
# recognized RevEmu-family ticket, this would accept ANY client whose real Steam
# check failed, not specifically RevEmu users, so it's rejected unless the admin
# opts in by pointing these at 3/4 (by IP) or another cid_* value.
cid_NoSteam47 = 5
cid_NoSteam48 = 5

# cid_SteamPending: a RevEmu-family/sXe/real-Steam auth resolved to STEAM_ID_LAN/
# STEAM_ID_PENDING (e.g. client's HDD serial/volume ID wasn't available) - gets its
# own rule instead of the normal cid_* above. Default 9 (STEAM_ID_PENDING) - this is
# an expected state for some clients, not an attack.
cid_SteamPending = 9

# cid_Steam: applied even to clients who passed the engine's OWN native Steam check
# (classic runs real Steam auth through this exact same pipeline too). Only 1/3/4 are
# supported here - anything else (notably 5/Deprecated) is silently clamped back to 1
# by qproto, because qproto can't safely reject a client the engine already
# authenticated via Steam (see the comment on QprotoConfig::cidSteam in qproto_cfg.h
# for why - classic can, but only via a ReHLDS-exposed Steam API stock HLDS doesn't have).
#   1 = Real STEAM_x:x:x (default) - deliberate no-op, native auth left untouched.
#   3/4 = mask even a real Steam player behind an IP-derived id.
cid_Steam = 1

# ========================================================
# 		REJECTION MESSAGES
# ========================================================
# Shown to the client themselves (via SV_RejectConnection) when the corresponding
# cid_* above (or qproto_bans.cfg) rejects them - matches classic's dp_rejmsg_* cvars
# in spirit. The native engine still sends its own generic "STEAM validation rejected"
# right after regardless (can't be suppressed from here) - see qproto_hook.cpp's header
# comment for why that's fine in practice (classic has shipped with the exact same
# double-message behavior for years). Each key only ever fires if its cid_* is actually
# set to 5 (Deprecated) - RejMsgNoSteam47/48 fire out of the box since those default to 5.

RejMsgUnknown = Client authorization failed.
RejMsgBanned = You have been banned from this server (hardware ban).
RejMsgNoSteam47 = Sorry, no-steam protocol 47 clients are not allowed on this server.
RejMsgNoSteam48 = Sorry, no-steam protocol 48 clients are not allowed on this server.
RejMsgRevEmu = Sorry, RevEmu clients are not allowed on this server.
RejMsgRevEmu2013 = Sorry, RevEmu2013 clients are not allowed on this server.
RejMsgSC2009 = Sorry, SC2009 clients are not allowed on this server.
RejMsgOldRevEmu = Sorry, Old RevEmu clients are not allowed on this server.
RejMsgSetti = Sorry, Setti is not allowed on this server.
RejMsgSXEI = Sorry, sXe Injected clients are not allowed on this server.
RejMsgSteamPending = Sorry, unauthorized/pending clients are not allowed on this server.

# ========================================================
# 		LOGGING
# ========================================================

# LoggingMode (bitmask, same as dproto.cfg):
#   0 = None
#   1 = Console (engine server console, prefixed "[QPROTO]")
#   2 = Log file (cstrike/addons/qproto/qproto.log - hook fires, ticket hex dumps,
#       auth results; independent of the engine's own mp_logfile)
#   3 = Both
# When the rl_logfile bit (2) is unset, qproto.log is never even created/touched.
LoggingMode = 2
