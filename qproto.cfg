# ========================================================
# 		QPROTO CONFIGURATION
# ========================================================
#
# Lives at the server root, next to dproto.cfg (not inside cstrike/).
#

# ========================================================
# 		EMULATOR SWITCHES
# ========================================================
# Per-emulator on/off, like cid_* in dproto.cfg. All 1 (on) by default.

# RevEmu >= 9.74 (152-byte ticket, signature "rev") - the mainstream/active format,
# confirmed working live with NextClient this session.
EnableRevEmu = 1

# RevEmu2013 (194-byte ticket, AES+SHA256)
EnableRevEmu2013 = 1

# SteamClient 2009 / SC2009 (178-byte ticket, AES+SHA256, same family as RevEmu2013)
EnableSC2009 = 1

# Legacy 10-byte ticket (magic 0xFFFF + XOR-encoded SteamID, no crypto). This is the
# format your rev.ini's RevEmu_2012/AllowOldRev flags most likely correspond to.
EnableOldRevEmu = 1

# Not yet implemented: AVSMP, SteamEmu (hCupa), Setti, SmartSteamEmu (SSE3).
# AVSMP/SteamEmu are long-abandoned and have no real ticket security to speak of;
# Setti is a monitoring/boost bot, not a player; SSE3's real dproto validation turned
# out to be a separate, more involved research task (different crypto pipeline, and
# possibly a different hook point entirely) - deferred rather than guessed at.

# ========================================================
# 		OUTPUT ID TYPE PER EMULATOR (cid_*)
# ========================================================
# Same numbering as dproto.cfg's cid_RevEmu etc.:
#  1: Real STEAM_xx:xx:xx        7: HLTV
#  2: Real VALVE_xx:xx:xx        8/9:  STEAM_ID_LAN / STEAM_ID_PENDING
#  3: STEAM_ by IP               10/11: VALVE_ID_LAN / VALVE_ID_PENDING
#  4: VALVE_ by IP               12: STEAM_666:88:666
#  5: Deprecated - client will be rejected
#
# We write into the engine's own client_t::network_userid and let its unmodified
# SV_GetIDString format the final string, which only understands idtype STEAM(1)/
# VALVE(2)/LOCAL(3=HLTV) - so anything other than 1, 2, 5 or 7 above still gets
# rendered as STEAM or VALVE (whichever family it belongs to); 5 rejects the client
# outright, matching dproto.cfg exactly.

cid_RevEmu = 1
cid_RevEmu2013 = 1
cid_SC2009 = 1
cid_OldRevEmu = 1

# ========================================================
# 		OTHER CONNECTION KINDS (ported from classic's client_auth.cpp)
# ========================================================
# These aren't ticket formats - they're recognized from connection context, exactly
# like classic's CHLTVAuthorizer/CSettiAuthorizer/CNoSteam47/48Authorizer.

# cid_HLTV: HLTV proxy connections (userinfo carries a non-empty "*hltv" key).
# Default 7 (HLTV) - don't block your own relay.
cid_HLTV = 7

# cid_Setti: Setti monitoring/promotion bot (recognized by its fixed 0x300-byte
# ticket and magic constants, same as classic). Default 3 (STEAM_by_IP) - it's not
# an attacker, don't reject it (matches the cid_Setti=3 convention already used in
# dproto.cfg on this server).
cid_Setti = 3

# cid_NoSteam47 / cid_NoSteam48: client sent no ticket at all (native Steam check
# failed and nothing above matched), split by negotiated protocol version - same
# two separate keys dproto.cfg itself uses. Default 5 (Deprecated/reject) - unlike a
# recognized RevEmu-family ticket, this would accept ANY client whose real Steam
# check failed, not specifically RevEmu users, so it's rejected unless the admin
# opts in by pointing these at 3/4 (by IP) or another cid_* value.
cid_NoSteam47 = 5
cid_NoSteam48 = 5

# cid_SteamPending: a RevEmu-family ticket parsed fine but resolved to
# STEAM_ID_LAN/STEAM_ID_PENDING (client's HDD serial/volume ID wasn't available) -
# gets its own rule instead of the emulator's normal cid_* above. Default 9
# (STEAM_ID_PENDING) - this is an expected state for some clients, not an attack.
cid_SteamPending = 9

# ========================================================
# 		LOGGING
# ========================================================

# LoggingMode (bitmask, same as dproto.cfg):
#   0 = None
#   1 = Console (engine server console, prefixed "[QPROTO]")
#   2 = Log file (cstrike/addons/qproto/qproto.log - hook fires, ticket hex dumps,
#       auth results; independent of the engine's own mp_logfile)
#   3 = Both
# When the rl_logfile bit (2) is unset, qproto.log is never even created/touched.
LoggingMode = 2
