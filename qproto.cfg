# ========================================================
# 		QPROTO CONFIGURATION
# ========================================================
#
# Lives at the server root, next to dproto.cfg (not inside cstrike/).
#

# ========================================================
# 		EMULATOR SWITCHES
# ========================================================
# Per-emulator on/off, like cid_* in dproto.cfg. All 1 (on) by default.

# RevEmu >= 9.74 (152-byte ticket, signature "rev") - the mainstream/active format,
# confirmed working live with NextClient this session.
EnableRevEmu = 1

# RevEmu2013 (194-byte ticket, AES+SHA256)
EnableRevEmu2013 = 1

# SteamClient 2009 / SC2009 (178-byte ticket, AES+SHA256, same family as RevEmu2013)
EnableSC2009 = 1

# Legacy 10-byte ticket (magic 0xFFFF + XOR-encoded SteamID, no crypto). This is the
# format your rev.ini's RevEmu_2012/AllowOldRev flags most likely correspond to.
EnableOldRevEmu = 1

# Not yet implemented: AVSMP, SteamEmu (hCupa), Setti, SmartSteamEmu (SSE3).
# AVSMP/SteamEmu are long-abandoned and have no real ticket security to speak of;
# Setti is a monitoring/boost bot, not a player; SSE3's real dproto validation turned
# out to be a separate, more involved research task (different crypto pipeline, and
# possibly a different hook point entirely) - deferred rather than guessed at.

# ========================================================
# 		FALLBACK BEHAVIOR
# ========================================================

# AllowIPFallback (0/1)
# When a client fails the engine's native Steam validation AND its ticket doesn't
# match any *enabled* format above, decide what happens:
#   0 = reject the connection (default, safer - only recognized RevEmu-family
#       tickets get let through; this is what dproto would do for an
#       unrecognized/garbage ticket too)
#   1 = accept anyway with a synthetic SteamID derived from the client's IP
#       (same idea as dproto.cfg's cid_NoSteam47/48 = 4, VALVE_by_IP).
#       Careful: this accepts ANY client whose real Steam check failed, not
#       just RevEmu users - e.g. the revloader+Steam.dll combo that only sends
#       a 1-byte placeholder ticket instead of a real one.
AllowIPFallback = 0

# ========================================================
# 		LOGGING
# ========================================================

# EnableLogging (0/1)
# Writes cstrike/addons/qproto/qproto.log (hook fires, ticket hex dumps, auth
# results). Independent of the engine's own mp_logfile. When 0, the file is never
# created/touched at all.
EnableLogging = 1
