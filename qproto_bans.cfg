# ========================================================
# 		QPROTO RAW AUTH KEY BANS
# ========================================================
#
# Lives at the server root, next to qproto.cfg (not inside cstrike/).
#
# Bans by the RAW value an emulated client's SteamID was derived from (HDD serial,
# volume id, or sXe Injected hardware id) instead of by the SteamID itself. A banned
# player who just reruns their ticket generator gets a brand new fake SteamID for
# free - the underlying hardware/volume id does not change, so this is what actually
# sticks.
#
# One hex-encoded key per line. To get a key: connect with the client once, look in
# qproto.log for a line like:
#   raw auth key (RevEmu, hex - qproto_ban_authkey()/qproto_bans.cfg use this exact string): 5744574334...
# copy the hex string after the colon into a line below (comments and blank lines are
# ignored, same as qproto.cfg).
#
# This file is also rewritten automatically whenever another plugin calls
# qproto_ban_authkey()/qproto_unban_authkey()/qproto_ban_client() (qproto_api.h) - hand
# edits survive until the next such call triggers a rewrite.

