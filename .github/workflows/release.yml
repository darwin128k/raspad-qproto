name: Release

on:
  push:
    tags:
      - 'v1.*'
      - 'v0.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.1)'
        required: true
        type: string
      ref:
        description: 'Git ref to build'
        required: true
        default: '1.0.0'
        type: string

permissions:
  contents: write

jobs:
  linux32:
    name: Build and publish Metamod zip
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}

      - name: Install i386 toolchain
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-multilib g++-multilib cmake ninja-build zip \
            libc6-dev:i386 libstdc++-12-dev:i386

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DQPROTO_BUILD_TESTS=OFF

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Pack Metamod layout
        run: |
          strip --strip-unneeded build/qproto_i386.so
          rm -rf dist && mkdir -p dist/addons/qproto
          cp build/qproto_i386.so dist/addons/qproto/qproto_i386.so
          cp qproto.cfg dist/addons/qproto/qproto.cfg
          cp qproto_bans.cfg dist/addons/qproto/qproto_bans.cfg
          cat > dist/addons/qproto/INSTALL.txt <<'EOF'
          Unpack into the game dir (cstrike/) so you get:

            addons/qproto/qproto_i386.so
            addons/qproto/qproto.cfg
            addons/qproto/qproto_bans.cfg

          In addons/metamod/plugins.ini add:
            linux addons/qproto/qproto_i386.so
          EOF
          sed -i 's/^          //' dist/addons/qproto/INSTALL.txt
          (cd dist && zip -r ../qproto-linux32-metamod.zip addons)

      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.tag.outputs.name }}"
          NOTES_FILE=$(mktemp)
          {
            echo "## Package"
            echo
            echo "Linux i386 Metamod plugin package (`qproto-linux32-metamod.zip` → `addons/qproto/`)."
            echo
            if [ -f CHANGELOG.md ]; then
              echo "## Changelog"
              echo
              awk '/^## / { if (seen++) exit; } seen { print }' CHANGELOG.md
              echo
            fi
          } > "$NOTES_FILE"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "$TAG" --notes-file "$NOTES_FILE" --generate-notes
          else
            gen=$(mktemp)
            gh api "repos/${{ github.repository }}/releases/generate-notes" \
              -f tag_name="$TAG" -f target_commitish="${{ github.sha }}" \
              --jq .body > "$gen" || true
            {
              cat "$NOTES_FILE"
              echo
              if [ -s "$gen" ]; then cat "$gen"; fi
            } > "$NOTES_FILE.full"
            gh release edit "$TAG" --notes-file "$NOTES_FILE.full"
          fi
          gh release upload "$TAG" qproto-linux32-metamod.zip --clobber
