name: Release
on:
  push:
    tags: ['v2.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag (v2.x)'
        required: false

jobs:
  release:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install i386 toolchain
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y g++-multilib ninja-build cmake libstdc++-12-dev:i386
      - name: Authum headers
        run: |
          git clone --depth 1 --branch 2.0.0 \
            https://github.com/darwin128k/raspad-authum.git ../raspad-authum
      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DAUTHUM_SRC_DIR=$PWD/../raspad-authum
          cmake --build build --target qproto
      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/modules/qproto/qproto.so
