name: CI
on:
  push:
    branches: [2.0.0]
  pull_request:
    branches: [2.0.0]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install i386 toolchain
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y \
            g++-multilib ninja-build cmake \
            libstdc++-12-dev:i386
      - name: metamod-p headers
        run: |
          git clone --depth 1 --branch v1.21p109 \
            https://github.com/Bots-United/metamod-p.git lib/metamod-p
      - name: Authum headers
        run: |
          git clone --depth 1 --branch 2.0.0 \
            https://github.com/darwin128k/raspad-authum.git ../raspad-authum
      - name: Configure & build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DAUTHUM_SRC_DIR=$PWD/../raspad-authum
          cmake --build build --target qproto
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: qproto.so
          path: build/modules/qproto/qproto.so
